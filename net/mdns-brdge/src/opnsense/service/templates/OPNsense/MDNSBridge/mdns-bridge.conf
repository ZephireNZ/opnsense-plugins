# DO NOT EDIT THIS FILE -- OPNsense auto-generated file

{% from 'OPNsense/Macros/interface.macro' import physical_interface %}
{% set interface_list=[] %}
{% set interfaces = OPNsense.MDNSBridge.interfaces.keys() %}
{% for i in interfaces %}
{% do interface_list.append(physical_interface(i)) %}
{% endfor %}


[global]
interfaces = {{ interface_list | join(', ') }}

# TODO: Maybe just always set enable/disable per interface?
disable-ipv4 = {{ 'yes' if OPNsense.MDNSBridge.global.disableIPv4 else 'no' }}
disable-ipv6 = {{ 'yes' if OPNsense.MDNSBridge.global.disableIPv6 else 'no' }}

# TODO: Support for:
# - allow-inbound-filters
# - deny-inbound-filters

disable-packet-filtering = {{ 'yes' if OPNsense.MDNSBridge.global.disablePacketFiltering else 'no' }}

{% for i in interfaces %}
[{{ physical_interface(i) }}]
disable-ipv4 = {{ 'yes' if OPNsense.MDNSBridge.interfaces[i].disableIPv4 else 'no' }}
disable-ipv6 = {{ 'yes' if OPNsense.MDNSBridge.interfaces[i].disableIPv6 else 'no' }}

# TODO: Support for:
# - allow-inbound-filters
# - deny-inbound-filters
# - allow-outbound-filters
# - deny-outbound-filters

{% endfor %}
