# DO NOT EDIT THIS FILE -- OPNsense auto-generated file

{% from 'OPNsense/Macros/interface.macro' import physical_interface %}
{% set interface_list=[] %}
{% for i in helpers.toList('OPNSense.MDNSBridge.interfaces') %}
{% do interface_list.append(physical_interface(i.name)) %}
{% endfor %}


[global]
interfaces = {{ interface_list | join(', ') }}

{% if helpers.exists('OPNsense.MDNSBridge.global') %}
{% set globalconf = OPNsense.MDNSBridge.global %}

# TODO: Maybe just always no, and explicitly set enable/disable per interface?
disable-ipv4 = {{ 'yes' if globalconf.disableIPv4 else 'no' }}
disable-ipv6 = {{ 'yes' if globalconf.disableIPv6 else 'no' }}

{% if 'allowInboundFilters' in globalconf and globalconf.allowInboundFilters != '' %}
allow-inbound-filters = {{ globalconf.allowInboundFilters }}
{% endif %}
{% if 'denyInboundFilters' in globalconf and globalconf.denyInboundFilters != '' %}
deny-inbound-filters = {{ globalconf.denyInboundFilters }}
{% endif %}

{% endif %}

disable-packet-filtering = {{ 'yes' if OPNsense.MDNSBridge.global.disablePacketFiltering else 'no' }}

{% for interface in OPNSense.MDNSBridge.interfaces %}
[{{ physical_interface(interface.name) }}]
disable-ipv4 = {{ 'yes' if interface.disableIPv4 else 'no' }}
disable-ipv6 = {{ 'yes' if interface.disableIPv6 else 'no' }}

{% if 'allowInboundFilters' in interface and interface.allowInboundFilters != '' %}
allow-inbound-filters = {{ interface.allowInboundFilters }}
{% endif %}
{% if 'denyInboundFilters' in interface and interface.denyInboundFilters != '' %}
deny-inbound-filters = {{ interface.denyInboundFilters }}
{% endif %}

{% if 'allowOutboundFilters' in interface and interface.allowOutboundFilters != '' %}
allow-outbound-filters = {{ interface.allowOutboundFilters }}
{% endif %}
{% if 'denyOutboundFilters' in interface and interface.denyOutboundFilters != '' %}
deny-outbound-filters = {{ interface.denyOutboundFilters }}
{% endif %}

{% endfor %}
